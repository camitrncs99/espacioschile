<script>
    document.querySelectorAll('.group.cursor-pointer').forEach((card) => {
        card.addEventListener('click', (event) => {
            if (event.target.closest('button')) {
                return;
            }

            window.location.href = 'detalleespacio.html';
        });
    });

    const loadMoreButton = Array.from(document.querySelectorAll('button')).find((button) =>
        button.textContent.trim() === 'Cargar más resultados'
    );

    if (loadMoreButton) {
        loadMoreButton.addEventListener('click', () => {
            alert('No hay más resultados disponibles por el momento.');
        });
    }
</script>
<script src="../session-management.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const gridEspacios = document.getElementById('grid-espacios');
    
    try {
      // 1. Obtener los datos reales del backend
      const response = await fetch('http://localhost:3000/spaces');
      if (!response.ok) throw new Error('Error al obtener los espacios');
      
      const spaces = await response.json();
      
      // 2. Si no hay espacios, mostrar un mensaje
      if (spaces.length === 0) {
        gridEspacios.innerHTML = '<p class="col-span-1 md:col-span-4 text-center text-on-surface-variant py-lg">No hay espacios publicados en este momento.</p>';
        return;
      }
      
      // 3. Generar las tarjetas con Tailwind CSS
      gridEspacios.innerHTML = spaces.map(space => {
        // Buscar la imagen marcada como portada o usar placeholder
        const coverImage = space.images?.find(img => img.isCover)?.imageUrl 
                           || 'https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80&w=400';
                           
        // Formatear el precio correspondiente a la modalidad
        const price = space.pricePerDay || space.pricePerHour || space.pricePerMonth || 0;
        const formattedPrice = new Intl.NumberFormat('es-CL').format(price);
        
        return `
          <div onclick="window.location.href='detalleespacio.html?id=${space.id}'" class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden hover:shadow-[0px_4px_12px_rgba(0,51,102,0.08)] transition-shadow flex flex-col group cursor-pointer">
            <div class="h-48 relative">
              <img alt="${space.title}" class="w-full h-full object-cover" src="${coverImage}">
            </div>
            <div class="p-md flex flex-col flex-grow justify-between">
              <div>
                <div class="flex justify-between items-start mb-base">
                  <h3 class="font-title-lg text-title-lg text-on-surface group-hover:text-primary transition-colors line-clamp-1">${space.title}</h3>
                  <button class="text-outline hover:text-primary transition-colors"><span class="material-symbols-outlined" data-icon="favorite_border">favorite_border</span></button>
                </div>
                <p class="font-body-sm text-body-sm text-on-surface-variant flex items-center gap-base mb-sm">
                  <span class="material-symbols-outlined text-sm" data-icon="location_on">location_on</span>${space.commune}, ${space.region}
                </p>
                <div class="flex flex-wrap gap-xs mb-sm">
                  <span class="bg-surface-container px-xs py-base rounded text-xs font-label-md text-on-surface">${space.category}</span>
                </div>
              </div>
              <div class="flex justify-between items-end mt-sm pt-sm border-t border-outline-variant/50">
                <div>
                  <p class="font-mono-price text-mono-price text-primary mb-base">$${formattedPrice} <span class="font-body-sm text-body-sm font-normal text-on-surface-variant">/ ${space.pricingMode.toLowerCase()}</span></p>
                  <p class="font-body-sm text-body-sm text-on-surface-variant">${space.surfaceM2} m²</p>
                </div>
                <div class="flex items-center gap-base text-secondary-fixed-dim">
                  <span class="material-symbols-outlined text-sm" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
                  <span class="font-label-md text-label-md text-on-surface">Nuevo</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
      
    } catch (error) {
      console.error('Error:', error);
      gridEspacios.innerHTML = '<p class="col-span-1 md:col-span-4 text-error text-center py-lg">Ocurrió un error al cargar los espacios. Verifica que el servidor esté encendido.</p>';
    }
  });
</script>
