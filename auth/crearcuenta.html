<script>
  const signupForm = document.querySelector('form');
  const rutInput = document.getElementById('rut');

  function isValidRut(value) {
    const normalizedRut = value.trim().replace(/[.\s]/g, '').toUpperCase();
    const rutMatch = normalizedRut.match(/^([1-9]\d{0,7})-?([\dK])$/);

    if (!rutMatch) {
      return false;
    }

    const body = rutMatch[1];
    const verifier = rutMatch[2];
    let sum = 0;
    let multiplier = 2;

    for (let index = body.length - 1; index >= 0; index--) {
      sum += Number(body[index]) * multiplier;
      multiplier = multiplier === 7 ? 2 : multiplier + 1;
    }

    const remainder = 11 - (sum % 11);
    const expectedVerifier = remainder === 11 ? '0' : remainder === 10 ? 'K' : String(remainder);

    return verifier === expectedVerifier;
  }

  rutInput.addEventListener('input', () => rutInput.setCustomValidity(''));

  signupForm.addEventListener('submit', (event) => {
    event.preventDefault();

    if (!isValidRut(rutInput.value)) {
      rutInput.setCustomValidity('Ingresa un RUT válido, por ejemplo 12.345.678-K.');
      rutInput.reportValidity();
      rutInput.focus();
      return;
    }

    window.location.href = 'login.html';
  });
</script>
