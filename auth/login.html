</div>

<div class="flex flex-col gap-base relative">
<label class="font-label-md text-label-md text-on-surface" for="password">Contraseña</label>
<input class="px-sm py-xs border border-outline-variant rounded-lg font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-colors bg-surface-container-lowest pr-10" id="password" placeholder="••••••••" required="" type="password">
<button aria-label="Mostrar contraseña" class="absolute right-sm top-[28px] text-on-surface-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<!-- Options (Remember & Forgot) -->
<div class="flex justify-between items-center mt-xs mb-sm">
<label class="flex items-center gap-xs cursor-pointer group">
<input class="rounded border-outline-variant text-primary-container focus:ring-primary-container w-4 h-4 cursor-pointer" type="checkbox">
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Recordarme</span>
</label>
