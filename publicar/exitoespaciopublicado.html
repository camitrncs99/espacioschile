<style>
        /* Custom animations for discrete confetti and card entry */
        @keyframes float-up {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            80% { transform: scale(1.5); opacity: 0; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        .animate-card {
            animation: float-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .pulse-circle::before {
            content: '';
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            background-color: theme('colors.secondary-container');
            z-index: -1;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        /* Discrete CSS Confetti */
        .confetti-piece {
            position: absolute;
            width: 8px;
            height: 16px;
            border-radius: 4px;
            opacity: 0;
            z-index: 10;
            pointer-events: none;
        }
        
        /* Generating a few static pieces for the effect */
        .c-1 { left: 20%; background-color: theme('colors.secondary'); animation: confetti-fall 3s linear infinite; animation-delay: 0.2s; }
        .c-2 { left: 40%; background-color: theme('colors.primary'); animation: confetti-fall 4s linear infinite; animation-delay: 1.5s; width: 12px; height: 12px; border-radius: 50%; }
        .c-3 { left: 60%; background-color: theme('colors.primary-fixed-dim'); animation: confetti-fall 2.5s linear infinite; animation-delay: 0.8s; }
        .c-4 { left: 80%; background-color: theme('colors.secondary-fixed'); animation: confetti-fall 3.5s linear infinite; animation-delay: 2.1s; width: 10px; height: 10px; border-radius: 50%; }
        .c-5 { left: 30%; background-color: theme('colors.surface-tint'); animation: confetti-fall 3.2s linear infinite; animation-delay: 0.5s; }
        .c-6 { left: 70%; background-color: theme('colors.secondary'); animation: confetti-fall 2.8s linear infinite; animation-delay: 1.2s; width: 6px; height: 12px; }
